items:
  - id: fpb-summary-mode
    family: FPB
    templates: [STANDARD, CLASSIC, COMPACT, HORIZONTAL]
    summary: summary mode for footer-side vs compact mobile tray behavior
    trigger: resolve summary mode helper
    data_precondition: footer_side layout and supported preset
    applicable_configurations: all
    expected_visual_result: tray below 1024, sidebar at 1024+
    expected_interaction_result: consistent toggle and disclosure behavior
    expected_accessibility_semantics: aria-expanded, inert when collapsed
    desktop_behavior: sidebar at >=1024
    mobile_behavior: tray below 1024
    automated_assertions:
      - getSummaryPresentationMode returns null|tray|sidebar
      - data-fpb-summary-mode propagates to owners
    screenshot_requirement: required
    approval_status: APPROVED
    fixture_ids: [fpb-all-templates]
    test_case_ids: [fpb-all-template-summary]
    status: DISCOVERED_CURRENT
    evidence: app/assets/widgets/full-page/methods/responsive-layout-methods.js
    runtime: app/assets/widgets/full-page/methods/responsive-layout-methods.js

  - id: fpb-selection-flow
    family: FPB
    templates: [STANDARD, CLASSIC, COMPACT, HORIZONTAL]
    summary: step/category selection progression for bundle completion
    trigger: step or product selection interaction
    data_precondition: category config and catalog are loaded
    applicable_configurations: all
    expected_visual_result: current step and selected products reflect selection progress
    expected_interaction_result: users can add/remove/adjust quantity and navigate when required constraints pass
    expected_accessibility_semantics: required/invalid states are exposed on interactive controls
    desktop_behavior: sidebar summary and step controls remain visible while selecting
    mobile_behavior: selection flow continues in compact controls while summary stays in tray mode
    automated_assertions:
      - step progression increments only when required validation is met
      - selected products persist across step transitions
    screenshot_requirement: required
    approval_status: APPROVED
    fixture_ids: [fpb-all-templates]
    test_case_ids: [fpb-all-template-summary]
    status: DISCOVERED_CURRENT
    evidence: app/assets/widgets/full-page/methods/selection-navigation-methods.js
    runtime: app/assets/widgets/full-page/methods/selection-navigation-methods.js

  - id: fpb-skeleton-loading
    family: FPB
    templates: [STANDARD, CLASSIC, COMPACT, HORIZONTAL]
    summary: loading placeholder rendering before catalog data hydrates
    trigger: first paint before product list resolves
    data_precondition: async product fetch in progress
    applicable_configurations: all
    expected_visual_result: predictable skeleton rows without layout shifts
    expected_interaction_result: selection controls remain non-functional until data is loaded
    expected_accessibility_semantics: loading state is announced and not keyboard-trapped
    desktop_behavior: static card-level placeholders in product grid area
    mobile_behavior: compact card placeholders in single-column fallback
    automated_assertions:
      - product placeholders render while products are loading
      - placeholders disappear once product data is present
    screenshot_requirement: required
    approval_status: APPROVED
    fixture_ids: [fpb-all-templates]
    test_case_ids: [fpb-all-template-summary]
    status: DISCOVERED_CURRENT
    evidence: app/assets/widgets/full-page/methods/product-grid-methods.js
    runtime: app/assets/widgets/full-page/methods/product-grid-methods.js

  - id: fpb-validation-messaging
    family: FPB
    templates: [STANDARD, CLASSIC, COMPACT, HORIZONTAL]
    summary: rule feedback for invalid or incomplete selection
    trigger: selection state violates min/max or required constraints
    data_precondition: validation hooks attached to selection and quantity state
    applicable_configurations: all
    expected_visual_result: inline error or feedback surfaces appear with recovery suggestion
    expected_interaction_result: invalid state requires remediation before checkout progression
    expected_accessibility_semantics: errors are programmatically attached to controls
    desktop_behavior: feedback appears adjacent to related step/category controls
    mobile_behavior: feedback stays visible without obscuring tray actions
    automated_assertions:
      - invalid constraints set selection blocked flag
      - fixing constraints clears validation message
    screenshot_requirement: required
    approval_status: APPROVED
    fixture_ids: [fpb-all-templates]
    test_case_ids: [fpb-all-template-summary]
    status: DISCOVERED_CURRENT
    evidence: app/assets/widgets/full-page/methods/validation-addons-methods.js
    runtime: app/assets/widgets/full-page/methods/validation-addons-methods.js

  - id: fpb-discount-messaging
    family: FPB
    templates: [STANDARD, CLASSIC, COMPACT, HORIZONTAL]
    summary: discount, savings, and tier messaging updates
    trigger: bundle subtotal or quantity changes
    data_precondition: discount config and pricing runtime present
    applicable_configurations: all
    expected_visual_result: messaging updates while preserving numeric format and location
    expected_interaction_result: users see savings eligibility change with each relevant selection
    expected_accessibility_semantics: savings text and totals are understandable to assistive tech
    desktop_behavior: savings messaging appears in card/footer regions
    mobile_behavior: savings messaging remains readable inside compact layout
    automated_assertions:
      - discount summary updates as selections change
      - discount tier state maps to visible messaging
    screenshot_requirement: required
    approval_status: APPROVED
    fixture_ids: [fpb-all-templates]
    test_case_ids: [fpb-all-template-summary]
    status: DISCOVERED_CURRENT
    evidence: app/assets/widgets/full-page/methods/discount-modal-methods.js
    runtime: app/assets/widgets/full-page/methods/discount-modal-methods.js

  - id: fpb-mobile-slot-rendering
    family: FPB
    templates: [STANDARD, CLASSIC, COMPACT, HORIZONTAL]
    summary: mobile summary slot and drawer rendering behavior
    trigger: viewport enters summary tray path
    data_precondition: summary mode resolved to mobile
    applicable_configurations: all
    expected_visual_result: slots/drawer mirrors selected products while remaining usable
    expected_interaction_result: users can edit or review selections through summary controls
    expected_accessibility_semantics: tray open/closed and control labels are exposed
    desktop_behavior: mobile summary structure is replaced by side panel
    mobile_behavior: compact slots render with clear edit affordances
    automated_assertions:
      - selected products render in slot list when mobile summary is active
      - edits in slot list propagate to main selection state
    screenshot_requirement: required
    approval_status: APPROVED
    fixture_ids: [fpb-all-templates]
    test_case_ids: [fpb-all-template-summary]
    status: DISCOVERED_CURRENT
    evidence: app/assets/widgets/full-page/methods/mobile-summary-methods.js
    runtime: app/assets/widgets/full-page/methods/mobile-summary-methods.js

  - id: fpb-sidebar-progress
    family: FPB
    templates: [STANDARD, CLASSIC, COMPACT, HORIZONTAL]
    summary: side panel and progress visibility across selection lifecycle
    trigger: step/category completion updates
    data_precondition: progress and completion values are computed from state
    applicable_configurations: all
    expected_visual_result: progress markers and counts remain synchronized with actual completion
    expected_interaction_result: users can infer completion and move confidently through steps
    expected_accessibility_semantics: progress state is read as non-decorative status
    desktop_behavior: side panel progress markers are continuously visible
    mobile_behavior: equivalent progress summary is visible in tray header
    automated_assertions:
      - computed completion ratio matches progress rendering
      - progress UI updates after selection changes
    screenshot_requirement: required
    approval_status: APPROVED
    fixture_ids: [fpb-all-templates]
    test_case_ids: [fpb-all-template-summary]
    status: DISCOVERED_CURRENT
    evidence: app/assets/widgets/full-page/methods/side-panel-methods.js
    runtime: app/assets/widgets/full-page/methods/side-panel-methods.js

  - id: ppb-template-selection
    family: PPB
    templates: [GRID, LIST, HORIZONTAL_SLOTS, VERTICAL_SLOTS]
    summary: template config resolves from templateType + designPreset
    trigger: render lifecycle
    data_precondition: selected bundle + preset flags
    applicable_configurations: all
    expected_visual_result: template-specific chrome and control flow
    expected_interaction_result: in-page or modal steps render with correct adapter
    expected_accessibility_semantics: preserved focus and navigation semantics
    desktop_behavior: matching desktop renderer
    mobile_behavior: matching mobile renderer
    automated_assertions:
      - TemplateDesignSystem.ppb.resolveByRuntimeContext returns contract for known type/preset combos
    screenshot_requirement: required
    approval_status: APPROVED
    fixture_ids: [ppb-all-templates]
    test_case_ids: [product-page-bundle-template-design-verification]
    status: DISCOVERED_CURRENT
    evidence: app/assets/widgets/product-page/templates/registry.js
    runtime: app/assets/widgets/product-page/templates/registry.js

  - id: ppb-inpage-vs-modal-mode
    family: PPB
    templates: [GRID, LIST, HORIZONTAL_SLOTS, VERTICAL_SLOTS]
    summary: in-page and modal mode resolution for PDP embedding
    trigger: mode config resolves from runtime context
    data_precondition: bundleDesignTemplate and mode fields present
    applicable_configurations: all
    expected_visual_result: interface uses the expected shell based on mode
    expected_interaction_result: users complete flow in the intended interaction surface
    expected_accessibility_semantics: active container exposes correct focus management
    desktop_behavior: mode keeps desktop shell and controls in expected layout
    mobile_behavior: modal or in-page constraints stay usable under narrow viewports
    automated_assertions:
      - contract resolves to PDP_INPAGE when configured
      - contract resolves to PDP_MODAL when configured
    screenshot_requirement: required
    approval_status: APPROVED
    fixture_ids: [ppb-all-templates]
    test_case_ids: [product-page-bundle-template-design-verification]
    status: DISCOVERED_CURRENT
    evidence: app/assets/widgets/product-page/methods/config-lifecycle-methods.js
    runtime: app/assets/widgets/product-page/methods/config-lifecycle-methods.js

  - id: ppb-slot-orientation
    family: PPB
    templates: [GRID, LIST, HORIZONTAL_SLOTS, VERTICAL_SLOTS]
    summary: slot orientation and flow orientation mapping to slots templates
    trigger: template contract render
    data_precondition: orientation-aware template chosen
    applicable_configurations: all
    expected_visual_result: vertical slots remain linear while horizontal slots remain scrollable
    expected_interaction_result: users can access and operate all slot actions in expected direction
    expected_accessibility_semantics: readable ordering and focus movement across orientation
    desktop_behavior: slot containers match orientation without clipping
    mobile_behavior: horizontal orientation remains reachable under thumb usage
    automated_assertions:
      - selected template contract drives horizontal vs vertical slot layout
      - slot items remain reachable in configured orientation
    screenshot_requirement: required
    approval_status: APPROVED
    fixture_ids: [ppb-all-templates]
    test_case_ids: [product-page-bundle-template-design-verification]
    status: DISCOVERED_CURRENT
    evidence: app/assets/widgets/product-page/templates/registry.js
    runtime: app/assets/widgets/product-page/templates/registry.js

  - id: ppb-selection-drawer-state
    family: PPB
    templates: [GRID, LIST, HORIZONTAL_SLOTS, VERTICAL_SLOTS]
    summary: drawer or modal footer open/close transitions
    trigger: selection/dismiss actions in footer
    data_precondition: footer shell and selection state present
    applicable_configurations: all
    expected_visual_result: open/closed state is visually consistent and stable
    expected_interaction_result: users can open, act on, and close selection drawers cleanly
    expected_accessibility_semantics: tray state and close action are announced correctly
    desktop_behavior: drawer and footer state stays aligned with side shell
    mobile_behavior: selection sheet interaction remains stable and not clipped
    automated_assertions:
      - drawer state flag toggles UI visibility
      - close action does not drop selected products
    screenshot_requirement: required
    approval_status: APPROVED
    fixture_ids: [ppb-all-templates]
    test_case_ids: [product-page-bundle-template-design-verification]
    status: DISCOVERED_CURRENT
    evidence: app/assets/widgets/product-page/methods/footer-modal-state-methods.js
    runtime: app/assets/widgets/product-page/methods/footer-modal-state-methods.js

  - id: ppb-footer-messaging
    family: PPB
    templates: [GRID, LIST, HORIZONTAL_SLOTS, VERTICAL_SLOTS]
    summary: footer CTA and informational messaging behavior
    trigger: selection count and validation state changes
    data_precondition: footer messaging path is mounted
    applicable_configurations: all
    expected_visual_result: footer messaging is present and matches current selection state
    expected_interaction_result: users receive clear next-step guidance
    expected_accessibility_semantics: helper messaging is discoverable for assistive technologies
    desktop_behavior: footer messaging stays stable next to actions
    mobile_behavior: compact footer messaging remains readable and tappable
    automated_assertions:
      - footer copy updates after selection and total changes
      - CTA state aligns with readiness requirements
    screenshot_requirement: required
    approval_status: APPROVED
    fixture_ids: [ppb-all-templates]
    test_case_ids: [product-page-bundle-template-design-verification]
    status: DISCOVERED_CURRENT
    evidence: app/assets/widgets/product-page/methods/footer-modal-state-methods.js
    runtime: app/assets/widgets/product-page/methods/footer-modal-state-methods.js

  - id: ppb-error-feedback
    family: PPB
    templates: [GRID, LIST, HORIZONTAL_SLOTS, VERTICAL_SLOTS]
    summary: recoverable and blocking errors for product page flows
    trigger: network, cart, or validation failure
    data_precondition: error object exists in state
    applicable_configurations: all
    expected_visual_result: clear error surfaces without unexpected layout jumps
    expected_interaction_result: users can recover, retry, or continue when possible
    expected_accessibility_semantics: error intent and recovery path are exposed accessibly
    desktop_behavior: error surfaces stay inside widget shell
    mobile_behavior: compact error state remains visible and actionable
    automated_assertions:
      - blocking errors inhibit add-to-bundle action
      - recoverable errors expose retry path
    screenshot_requirement: required
    approval_status: APPROVED
    fixture_ids: [ppb-all-templates]
    test_case_ids: [product-page-bundle-template-design-verification]
    status: DISCOVERED_CURRENT
    evidence: app/assets/widgets/product-page/methods/modal-state-methods.js
    runtime: app/assets/widgets/product-page/methods/modal-state-methods.js
