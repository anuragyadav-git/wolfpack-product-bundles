<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Local reversible control fixture for Chrome DevTools MCP smoke testing.">
    <title>Storefront Design Director Chrome Smoke Fixture</title>
    <link rel="icon" href="data:,">
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f6f7;
        color: #202223;
      }

      main {
        box-sizing: border-box;
        inline-size: min(32rem, calc(100% - 2rem));
        padding: 2rem;
        border: 1px solid #c9cccf;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 0.25rem 1rem rgb(0 0 0 / 8%);
      }

      button {
        min-block-size: 2.75rem;
        padding-inline: 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: #005bd3;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 0.1875rem solid #202223;
        outline-offset: 0.1875rem;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="fixture-title">
      <h1 id="fixture-title">Chrome automation smoke fixture</h1>
      <p id="fixture-description">This local page has one reversible, non-destructive control.</p>
      <button type="button" id="fixture-toggle" aria-pressed="false" aria-describedby="fixture-description">
        Toggle fixture state
      </button>
      <p id="fixture-status" role="status" aria-live="polite">Fixture state: idle</p>
    </main>
    <script>
      const button = document.getElementById("fixture-toggle");
      const status = document.getElementById("fixture-status");
      button.addEventListener("click", () => {
        const active = button.getAttribute("aria-pressed") !== "true";
        button.setAttribute("aria-pressed", String(active));
        status.textContent = `Fixture state: ${active ? "active" : "idle"}`;
      });
    </script>
  </body>
</html>
