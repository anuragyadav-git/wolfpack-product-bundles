          "responsive-contract.md"
        ]
      },
      {
        "id": "D-003",
        "question": "Which visual treatment should define the active Step Title?",
        "selected_value": "Direction A \u2014 Content Heading: responsive, strongly weighted, unboxed, left-aligned with the active selection content, naturally wrapping, and absent without residual spacing when unconfigured.",
        "rationale": "It fixes the measured hierarchy and alignment problem with the lowest theme-compatibility and visual-noise risk across FPB and PPB.",
        "status": "locked",
        "approver": "Aditya Awasthi",
        "approved_at": "2026-08-27T12:51:12Z",
        "revision": 1,
        "affected_artifacts": [
