      {
        "id": "D-001",
        "question": "Which storefront product families are included in the Step-title redesign?",
        "selected_value": "FPB and PPB, across all storefront templates and both desktop and mobile.",
        "rationale": "The user expanded the initial FPB request to include PPB so the title treatment remains coherent across bundle families.",
