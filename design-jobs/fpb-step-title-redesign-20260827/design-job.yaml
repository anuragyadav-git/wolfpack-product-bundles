      {
        "id": "D-002",
        "question": "How should Step Name and Step Title divide responsibility on the storefront?",
        "selected_value": "Step Name remains the short navigation and progress label; Step Title is one visually prominent local heading for the active product-selection area.",
        "rationale": "This keeps merchant-configured long-form titles out of compact navigation and establishes one consistent hierarchy across FPB and PPB.",
        "status": "locked",
        "approver": "Aditya Awasthi",
        "approved_at": "2026-08-27T12:43:39Z",
        "revision": 1,
        "affected_artifacts": [
