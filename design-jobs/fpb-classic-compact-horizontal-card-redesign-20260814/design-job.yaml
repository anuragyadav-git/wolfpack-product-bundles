  "scope": {
    "product_family": "FPB",
    "template": "STANDARD, CLASSIC, COMPACT, HORIZONTAL",
    "component": "widget-owned storefront layout, with priority on product-card pricing and action alignment",
    "implementation_mode": "design-director",
    "design_goal": "Correct measured placement and alignment defects across all four FPB templates while preserving each template's established Wolfpack identity and all storefront behavior.",
    "user_problem": "Minute placement defects, especially state-dependent price and action movement, can make otherwise-correct FPB templates feel unstable or unfinished.",
    "primary_user_action": "Browse products and operate variant, add, remove, and quantity controls without card geometry shifting.",
    "out_of_scope": [
      "redesigning the established visual identity of any FPB template",
      "unmeasured cosmetic cleanup outside a demonstrated placement or alignment defect",
      "product loading, filtering, pagination, selection, pricing, validation, and cart logic",
      "API, schema, copy, persistence, new merchant settings, runtime styling, and new abstractions"
    ],
    "merchant_configurability": [
      "reuse existing merchant-owned card and typography tokens",
      "no new merchant settings"
    ],
    "business_logic_constraints": [
      "preserve existing DOM, class, and data interfaces",
      "preserve equal card heights within each row across all states",
      "prefer the narrowest active raw CSS owner, using shared CSS only for defects confirmed across every preset",
      "stop and re-scope under TDD if existing DOM and CSS cannot express a required correction"
    ]
  },
