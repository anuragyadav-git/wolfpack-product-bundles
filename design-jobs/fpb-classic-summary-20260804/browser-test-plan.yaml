  "assertions": {
    "library": "references/chrome-devtools-test-protocol.md",
    "require_json_serializable_results": true,
    "geometry_tolerances": "design-tokens.json#/geometry_assertions",
    "accessibility": [
      "fresh accessibility snapshot per critical state",
      "keyboard order and names",
      "focus visibility and return",
      "reduced motion"
    ],
    "responsive": [
      "1023/1024/1025 available width",
      "767/768/769 legacy boundary",
      "600px constrained component",
      "319/320 narrow boundary"
    ],
    "asset_freshness": [
      "active stylesheet URL",
      "expected loaded rule",
      "widget version"
    ]
  },
  "screenshots": {
    "format": "png",
    "index_path": "qa/screenshot-index.json",
    "element_required": true,
    "viewport_required": true,
    "before_after_critical_interactions": true,
    "full_page_only_when_needed": true,
    "exclude_browser_chrome": true,
    "do_not_commit_investigation_screenshots": true,
    "metadata_required": [
      "viewport",
      "available-component-width",
      "dpr",
      "zoom",
      "state",
      "revision",
      "asset-url",
      "widget-version"
    ]
  },
  "console_policy": {
    "fail_on": [
      "uncaught-exception",
      "unhandled-promise-rejection",
      "severe-application-error",
      "failed-resource-parse",
      "new-repeated-warning",
      "accessibility-runtime-error",
      "hydration-error",
      "duplicate-key-warning",
      "change-caused-csp-violation",
      "tested-interaction-error"
    ],
    "allowlist": [],
    "compare_to_control_baseline": true
  },
  "network_policy": {
    "fail_on": [
      "unexpected-4xx-5xx",
      "blocked-required-asset",
      "implementation-caused-abort",
      "cors-error",
      "duplicate-mutation",
      "missing-product-media",
      "missing-translation",
      "local-to-production-request",
      "real-order-or-destructive-action"
    ],
    "expected_analytics": [],
    "redact_secrets_and_private_bodies": true,
    "intercept_destructive_cart_or_order_paths": true
  },
  "lighthouse": {
    "required": true,
    "devices": [
      "desktop",
      "mobile"
    ],
    "modes": [
      "snapshot",
      "navigation"
    ],
    "categories": [
      "accessibility",
      "best-practices"
    ],
    "performance_excluded": true,
    "performance_exclusion_reason": "Performance is captured with targeted DevTools traces so component attribution is not conflated with Shopify theme/navigation scoring.",
    "report_paths": {
      "desktop": "qa/lighthouse/desktop.json",
      "mobile": "qa/lighthouse/mobile.json"
    },
    "classification": "Distinguish pre-existing theme/page findings from component-introduced findings."
  },
  "performance": {
    "required": true,
    "triggers": [
      "responsive layout ownership changed",
      "sticky and internal scroll geometry changed",
      "loading reservation changed",
      "interactive disclosure and action layout changed"
    ],
    "not_applicable_reason": "",
    "trace_paths": [
      "qa/performance/desktop-1440.trace.json",
      "qa/performance/mobile-390.trace.json"
    ],
    "metrics": [
      "LCP",
      "CLS",
      "interaction-findings",
      "long-tasks",
      "layout-shift-sources",
      "image-font-loading"
    ],
    "pass_condition": "No attributable regression outside approved geometry tolerances; record candidates and shift sources."
  },
