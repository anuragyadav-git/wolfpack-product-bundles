  "scope": {
    "product_family": "FPB and PPB",
    "template": "FPB Standard, Classic, Compact, Horizontal; PPB Grid, List, Horizontal Slots, Vertical Slots",
    "component": "Variant selectors in product cards, FPB product-details modal, and PPB modal picker cards",
    "implementation_mode": "design-director",
    "design_goal": "Create template-fit variant selectors that remain legible, uncongested, and fully contained across cards and modal surfaces at desktop and mobile widths.",
    "user_problem": "Current dropdown, pill, color-swatch, and image-swatch presentations do not reliably fit the differently shaped product cards and modal surfaces without clipping, overflow, or congestion.",
    "primary_user_action": "Review available product variants and select one without losing access to the card image, title, price, inventory feedback, quantity controls, or primary action.",
    "out_of_scope": [
      "Changing Shopify variant, availability, pricing, or cart semantics",
      "Inferring colors or images when Shopify ProductOptionValue.swatch data is missing",
      "Redesigning product cards, bundle summaries, navigation, discounts, or checkout beyond selector accommodation",
      "Changing merchant storefront theme CSS"
    ],
    "merchant_configurability": [
      "FPB and PPB category variantSelectorMode: dropdown, pill, color_swatch, image_swatch",
      "FPB and PPB color-swatch tooltip enablement",
      "Existing FPB bundle variant-selector enablement and primary option selection",
      "Existing design-system colors, radii, and typography tokens"
    ],
    "business_logic_constraints": [
      "Shopify Storefront API ProductOptionValue.swatch remains the only color/image swatch source",
      "Variant changes must continue updating active variant, image, price, availability, and inventory context through existing delegated handlers",
      "Add and quantity actions remain the only selection/cart mutations",
      "Unavailable variants remain disabled and labeled",
      "Cards in a row remain equal height and cannot grow across selection, hover, or focus states",
      "FPB product details and PPB picker preserve existing modal ownership, focus restoration, and scroll locking"
    ]
  },
