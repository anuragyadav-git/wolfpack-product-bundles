<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">Storefront featured product placement</title>
  <desc id="desc">A compact featured collection preview with the bundle product visible among three products.</desc>
  <rect width="640" height="320" fill="#faf8f5"/>
  <rect width="640" height="58" fill="#fff"/>
  <text x="26" y="36" fill="#1f1f1f" font-family="Georgia,serif" font-size="18">MONO EDIT</text>
  <g fill="#666" font-family="Arial,sans-serif" font-size="11"><text x="430" y="34">SHOP</text><text x="477" y="34">COLLECTIONS</text><text x="555" y="34">ABOUT</text></g>
  <text x="24" y="91" fill="#222" font-family="Arial,sans-serif" font-size="18" font-weight="700">Featured collection</text>
  <g transform="translate(24 108)">
    <g fill="#e4ddd2"><rect width="180" height="132"/><rect x="194" width="180" height="132"/><rect x="388" width="180" height="132"/></g>
    <circle cx="90" cy="64" r="38" fill="#bda98c"/><rect x="232" y="25" width="104" height="80" rx="16" fill="#c7af91"/><path d="M420 106c16-48 48-76 100-90 22 28 30 59 25 90z" fill="#8fa083"/>
    <g fill="#222" font-family="Arial,sans-serif" font-size="13"><text y="155">Ceramic set</text><text x="194" y="155" font-weight="700">Build your own bundle</text><text x="388" y="155">Home essentials</text></g>
    <g fill="#747474" font-family="Arial,sans-serif" font-size="11"><text y="177">$48.00</text><text x="194" y="177">From $60.00</text><text x="388" y="177">$52.00</text></g>
    <rect x="194" y="187" width="116" height="28" rx="4" fill="#222"/><text x="252" y="206" fill="#fff" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">Build a bundle</text>
  </g>
</svg>
