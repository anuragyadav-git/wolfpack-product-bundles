name = "bundle-builder"

[build]
asset_dir = "assets"

[[extensions]]
name = "bundle-builder"

uid = "23b807f7-472d-4f93-e241-5a1e079d6b51548daaf2"

type = "theme"
handle = "bundle-builder"
api_version = "2025-10"

[[extensions.blocks]]
target = "all"
liquid_path = "blocks/bundle-product-page.liquid"

# Product page upsell placement anchor
[[extensions.blocks]]
target = "all"
liquid_path = "blocks/bundle-upsell.liquid"

# Product Page Bundle embed custom-placement anchor
[[extensions.blocks]]
target = "all"
liquid_path = "blocks/bundle-product-page-embed.liquid"

# Provider-neutral PageFly, GemPages, and Shogun placement block
[[extensions.blocks]]
target = "all"
liquid_path = "blocks/bundle-page-builder-embed.liquid"

# Single App Embed — activated once per store in Theme Settings > App Embeds
[[extensions.blocks]]
target = "body"
liquid_path = "blocks/bundle-app-embed.liquid"
