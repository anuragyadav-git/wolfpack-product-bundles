query Input {
  presentmentCurrencyRate
  localization { country { isoCode } }
  shop {
    ppbPolicyRevisions: metafield(namespace: "$app", key: "ppb_policy_revisions") { value: jsonValue }
  }
  cartTransform {
    runtimeConfiguration: metafield(namespace: "$app", key: "runtime_configuration") {
      value: jsonValue
    }
  }
  cart {
    bundleDetails: metafield(namespace: "$app", key: "bundle_details") {
      value
    }
    lines {
      id
      quantity
      wolfpackProductBundleOfferId: attribute(key: "_wolfpackProductBundle:OfferId") {
        value
      }
      lineAuthorization: attribute(key: "_wolfpack_line_auth") {
        value
      }
      stepType: attribute(key: "_bundle_step_type") {
        value
      }
      sellingPlanAllocation { __typename }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product { id title }
          # For EXPAND: Check if this variant is a bundle parent
          component_reference: metafield(namespace: "$app", key: "component_reference") {
            value
          }

          # Price adjustment configuration for discounting
          price_adjustment: metafield(namespace: "$app", key: "price_adjustment") {
            value
          }

        }
      }
      cost {
        amountPerQuantity {
          amount
        }
      }
    }
  }
}
